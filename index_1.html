function bsDone(b){const xx=BS.find(y=>y.bid===b);if(xx&&!ownerOK(xx.o))return;const x=xx,t=tasks.find(z=>z.t.toLowerCase()===x.t.toLowerCase()&&z.st!=='done');
 if(t){if(!closable(t)){toast('Close it here first (Impact Card / attachment)');return detail(t.id,true)}}
 x.bsSt='Done';x.sync='Queued → BS Tasks (awaiting API)';bsPush(x.bid).then(ok=>{if(ok){x.sync='Synced to BS Tasks';render()}});if(t)t.st='done';toast('Marked done · queued for BS Tasks');render()}
function dump(){const v=document.getElementById('ld').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!v.length)return;v.forEach(t=>laundry.push({id:Date.now()+Math.random(),t,by:me(),at:new Date().toISOString().slice(0,10)}));toast(v.length+' added to laundry');render()}
function park(i,v){laundry.find(x=>x.id===i).parked=v;render()}
function ldel(i){laundry=laundry.filter(x=>x.id!==i);render()}
function promote(i){const x=laundry.find(y=>y.id===i),s=suggest(x);
 modal(`<h3>Promote to task</h3><label>Task</label><input id="pt" value="${x.t.replace(/"/g,'&quot;')}">
 <div class="row"><div><label>Owner</label><select id="po">${PEOPLE.map(p=>`<option ${p===s.o?'selected':''}>${p}</option>`)}</select></div><div><label>Goal</label><select id="pg"><option value="">None</option>${GOALS.map(g=>`<option ${g.id===s.g?'selected':''}>${g.id}</option>`)}</select></div></div>
 <div class="row"><div><label>Priority</label><select id="pc">${Object.keys(CAT).map(k=>`<option value="${k}" ${k===s.c?'selected':''}>${CAT[k][0]}</option>`)}</select></div><div><label>Due</label><input id="pd" type="date" value="${s.due}"></div></div>
 <div class="right"><button class="btn" onclick="close_()">Cancel</button><button class="btn p" onclick="doPromote(${i})">Promote</button></div>`)}
function doPromote(i){const g=k=>document.getElementById(k).value;const v={t:g('pt'),o:g('po'),gl:g('pg'),c:g('pc'),du:g('pd')};close_();
 wipCheck(v.o,()=>{tasks.push(T(v.t,v.o,v.gl,v.c,v.du,{src:'Laundry list'}));laundry=laundry.filter(y=>y.id!==i);toast('Promoted → '+v.o);render()})}
function setAct(k,v){MT[k].p=Math.max(0,Math.min(100,+v||0));render()}
function reopen(i){const t=tasks.find(x=>x.id===i);if(t.o!==actor())return toast('Only '+t.o+' can reopen this task');t.st='todo';delete t.doneAt;delete t.dropped;toast('Reopened');render()}
function bump(i,v){const t=tasks.find(x=>x.id===i);t.boost+=v;render()}
function moveTo(i,dt){const t=tasks.find(x=>x.id===i);if(!t)return;snap();if(dt==='later'){const x=new Date(TODAY);x.setDate(x.getDate()+7);t.due=d(x.toISOString().slice(0,10))}else if(dt)t.due=d(dt);render();toast('Moved to '+fmt(t.due),1)}
function wipCheck(o,then){return then();const a=open().filter(t=>t.o===o);if(a.length<WIP)return then();
 modal(`<h3>${o} already has ${a.length} open tasks (limit ${WIP})</h3><p class="src">Drop or re-date one before adding more.</p>
 ${a.sort((x,y)=>score(x)-score(y)).map(t=>`<div class="task"><div class="t"><div class="ti">${t.t}</div><div class="meta">${dueTxt(t)} · score ${score(t)}</div></div><button class="btn s" onclick="wipAct(${t.id},'drop')">Drop</button> <button class="btn s" onclick="wipAct(${t.id},'later')">+7 days</button></div>`).join('')}
 <div class="right"><button class="btn" onclick="close_()">Cancel</button></div>`);window._wipThen=then;window._wipO=o}
function wipAct(i,a){const t=tasks.find(x=>x.id===i);if(a==='drop')t.st='done',t.dropped=1;else{const x=new Date(t.due<TODAY?TODAY:t.due);x.setDate(x.getDate()+7);t.due=d(x.toISOString().slice(0,10))}
 if(a==='drop'&&open().filter(t=>t.o===window._wipO).length<WIP){close_();window._wipThen()}else if(a==='later'){toast('Re-dated: still '+open().filter(t=>t.o===window._wipO).length+' open. Drop one to add.');wipCheck(window._wipO,window._wipThen)}else wipCheck(window._wipO,window._wipThen)}
function approve(i){const x=inbox.find(y=>y.id===i);wipCheck(x.o,()=>{tasks.push(T(x.t,x.o,null,x.c,x.due,{src:x.src,presence:!!x.presence}));inbox=inbox.filter(y=>y.id!==i);toast('Approved → added to '+x.o);render()})}
function reject(i){inbox=inbox.filter(y=>y.id!==i);toast('Rejected');render()}
function addTask(){modal(`<h3>${me()==='Narendra'?'New task':'Suggest a task (needs Narendra\'s approval)'}</h3><label>Task</label><input id="nt">
 <div class="row"><div><label>Owner</label><select id="no">${PEOPLE.map(p=>`<option ${p===me()?'selected':''}>${p}</option>`)}</select></div><div><label>Goal</label><select id="ng"><option value="">None</option>${GOALS.map(g=>`<option>${g.id}</option>`)}</select></div></div>
 <div class="row"><div><label>Priority</label><select id="nc"><option value="L">Leadership ask</option><option value="R">Revenue impact</option><option value="P">Platform deadline</option><option value="C">Store crisis</option></select></div><div><label>Due</label><input id="nd" type="date" value="${TODAY.toISOString().slice(0,10)}"></div></div>
 <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="np" style="width:auto"> Presence only (no Impact Card needed)</label>
 <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="na" style="width:auto"> 📎 Attachment required to close</label>
 <div class="right"><button class="btn" onclick="close_()">Cancel</button><button class="btn p" onclick="saveT()">Save</button></div>`)}
function saveT(){const g=k=>document.getElementById(k);if(!g('nt').value)return;const v={t:g('nt').value,o:g('no').value,gl:g('ng').value||null,c:g('nc').value,du:g('nd').value,p:g('np').checked,a:g('na').checked};close_();
 if(me()==='Narendra')wipCheck(v.o,()=>{tasks.push(T(v.t,v.o,v.gl,v.c,v.du,{src:'Self',presence:v.p,needAtt:v.a}));toast('Added');render()});
 else{inbox.push({id:Date.now(),t:v.t,o:v.o,c:v.c,due:v.du,src:'Team ('+me()+')',why:'Added by '+me(),presence:v.p});toast('Sent to Narendra for approval');render()}}
function filt(q){q=q.toLowerCase();document.querySelectorAll('#it tr').forEach((r,i)=>{if(i)r.style.display=r.textContent.toLowerCase().includes(q)?'':'none'})}
document.getElementById('me').onchange=render;document.getElementById('mo').onchange=e=>{mineOnly=e.target.checked;render()};window.onhashchange=render;render();boot();
</script>
</body>
</html>
