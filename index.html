.bar{height:8px;background:#eee;border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--acc)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px 6px;border-top:1px solid var(--line);font-size:13px;vertical-align:top}th{color:var(--mut);font-weight:500;border-top:0}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.banner{background:var(--acc2);border:1px solid #ffd8bf;border-radius:12px;padding:12px 16px;margin-bottom:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9}
.modal.on{display:flex}.mbox{background:#fff;border-radius:14px;padding:20px;width:min(560px,94vw);max-height:90vh;overflow:auto}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

 BS.splice(0,BS.length,...mine.map(x=>({bid:x.id,t:x.title,list:x.list_name||'—',o:who.find(([,n])=>n===x.owner_name)[0],due:(x.due_date||'').slice(0,10),bsSt:x.status==='done'?'Done':'Open',sync:'—'})));
 lastSync=new Date().toLocaleString('en-IN');persist()}catch(e){console.log('BS pull failed',e)}}

function render(){if(sb&&!sb._ok)return;persist();const v=(location.hash||'#today').slice(1);document.getElementById('v').innerHTML=(V[v]||V.today)();
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));document.getElementById('ib').textContent=inbox.length||'';document.getElementById('lb').textContent=laundry.filter(x=>!x.parked).length||'';document.getElementById('bsb').textContent=BS.filter(x=>x.bsSt!=='Done').length}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function modal(h){document.getElementById('mb').innerHTML=h;document.getElementById('m').classList.add('on')}

function done(i){const t=tasks.find(x=>x.id===i);
 if(t.needAtt&&!t.att.length){toast('Attachment required before closing');return detail(i)}
 if(t.presence||t.card){t.st='done',t.doneAt=new Date().toISOString();toast('Closed'+(t.src==='BS Tasks'?' · will mark Done in BS Tasks':''));return render()}
 detail(i,true)}
function detail(i,closing){const t=tasks.find(x=>x.id===i),c=t.card||{};
 modal(`<h3>${closing?'Close: ':''}${t.t}</h3>
 <div class="row3"><div><label>Owner</label><select id="do">${PEOPLE.map(p=>`<option ${p===t.o?'selected':''}>${p}</option>`)}</select></div><div><label>Due</label><input id="dd" type="date" value="${t.due.toISOString().slice(0,10)}"></div>
 <div><label>Priority</label><select id="dc">${Object.keys(CAT).map(k=>`<option value="${k}" ${k===t.c?'selected':''}>${CAT[k][0]}</option>`)}</select></div></div>
 <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="dp" style="width:auto" ${t.presence?'checked':''}> Presence only (no Impact Card)</label>
 <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="dn" style="width:auto" ${t.needAtt?'checked':''}> 📎 Attachment required to close</label>
 <h3 style="margin-top:16px;font-size:14px">Attachments (${t.att.length})</h3>
 ${t.att.map((a,k)=>`<div class="meta" style="font-size:13px">📎 <a href="${a.u}" target="_blank" rel="noopener">${a.n}</a> <a href="#" onclick="event.preventDefault();rmAtt(${i},${k})">remove</a></div>`).join('')||'<div class="empty">None yet</div>'}
 <div class="row"><input id="al" placeholder="Paste Drive / Sheet link"><div style="display:flex;gap:6px"><button class="btn s" onclick="addLink(${i})">Add link</button><label class="btn s" style="margin:0;color:var(--ink)">Upload file<input type="file" style="display:none" onchange="addFile(${i},this)"></label></div></div>
 <h3 style="margin-top:16px;font-size:14px">Impact Card ${t.presence?'(not needed)':''}</h3>
 <div class="src">Fill it any time: when you start (hypothesis, stores, start date) and when you close (results, verdict).</div>
 <label>Hypothesis / what we changed</label><input id="ih" value="${c.h||''}">
 <div class="row"><div><label>Platform</label><select id="ip">${['Zomato','Swiggy','Toing','Ownly','All'].map(x=>`<option ${x===c.p?'selected':''}>${x}</option>`)}</select></div><div><label>Stores</label><input id="is" value="${c.stores||''}" placeholder="e.g. NCR COCO / 39 stores"></div></div>
 <div class="row"><div><label>Start</label><input id="isd" type="date" value="${c.s||''}"></div><div><label>End</label><input id="ied" type="date" value="${c.e||''}"></div></div>
 <div class="row3"><div><label>Sales Δ</label><input id="isa" value="${c.sales||''}" placeholder="+5%"></div><div><label>Margin Δ</label><input id="ima" value="${c.margin||''}" placeholder="+1pp"></div><div><label>Funnel Δ</label><input id="ifu" value="${c.funnel||''}" placeholder="C2O +2pp"></div></div>
 <div class="row"><div><label>Verdict</label><select id="iv"><option value="">—</option>${['Scale','Retest','Stop'].map(x=>`<option ${x===c.v?'selected':''}>${x}</option>`)}</select></div><div><label>Learning (1–2 lines)</label><input id="il" value="${c.l||''}"></div></div>
 <div class="right"><button class="btn" onclick="saveD(${i},false)">Save</button><button class="btn p" onclick="saveD(${i},true)">Save & close task</button></div>`)}
function readD(i){const t=tasks.find(x=>x.id===i),g=k=>document.getElementById(k).value;
 t.o=g('do');t.due=d(g('dd'));t.c=g('dc');t.presence=document.getElementById('dp').checked;t.needAtt=document.getElementById('dn').checked;
 const c={h:g('ih'),p:g('ip'),stores:g('is'),s:g('isd'),e:g('ied'),sales:g('isa'),margin:g('ima'),funnel:g('ifu'),v:g('iv'),l:g('il')};
 if(c.h||c.stores||c.v||c.l)t.card=c;return t}
function saveD(i,closeIt){const t=readD(i);
 if(closeIt){if(t.needAtt&&!t.att.length)return toast('Add an attachment first: this task needs one to close');
  if(!t.presence&&!(t.card&&t.card.v&&t.card.l))return toast('Add Verdict + Learning, or tick Presence only');
  t.st='done',t.doneAt=new Date().toISOString();const bx=BS.find(y=>y.t.toLowerCase()===t.t.toLowerCase());if(bx){bx.bsSt='Done';bx.sync='Queued → BS Tasks (awaiting API)'}if(t.card)impacts.unshift({t:t.t,p:t.card.p,stores:t.card.stores||'-',s:t.card.s||'-',e:t.card.e||'-',sales:t.card.sales||'-',margin:t.card.margin||'-',funnel:t.card.funnel||'-',v:t.card.v,l:t.card.l,att:t.att.length});
  toast('Closed'+(t.card?' + impact saved':'')+(t.src==='BS Tasks'?' · will mark Done in BS Tasks':''))}else toast('Saved');
 close_();render()}
function addLink(i){const u=document.getElementById('al').value.trim();if(!u)return;readD(i);const t=tasks.find(x=>x.id===i);t.att.push({n:u.replace(/^https?:\/\//,'').slice(0,45),u});detail(i)}
function addFile(i,inp){const f=inp.files[0];if(!f)return;readD(i);tasks.find(x=>x.id===i).att.push({n:f.name,u:URL.createObjectURL(f)});detail(i)}

function bsDone(b){const x=BS.find(y=>y.bid===b),t=tasks.find(z=>z.t.toLowerCase()===x.t.toLowerCase()&&z.st!=='done');
 if(t){if(t.needAtt&&!t.att.length||(!t.presence&&!t.card)){toast('Close it here first (Impact Card / attachment)');return detail(t.id,true)}}
 x.bsSt='Done';x.sync='Queued → BS Tasks (awaiting API)';bsPush(x.bid).then(ok=>{if(ok){x.sync='Synced to BS Tasks';render()}});if(t)t.st='done';toast('Marked done · queued for BS Tasks');render()}

function wipCheck(o,then){const a=open().filter(t=>t.o===o);if(a.length<WIP)return then();
 modal(`<h3>${o} already has ${a.length} open tasks (limit ${WIP})</h3><p class="src">Drop or re-date one before adding more.</p>
 ${a.sort((x,y)=>score(x)-score(y)).map(t=>`<div class="task"><div class="t"><div class="ti">${t.t}</div><div class="meta">${dueTxt(t)} · score ${score(t)}</div></div><button class="btn s" onclick="wipAct(${t.id},'drop')">Drop</button> <button class="btn s" onclick="wipAct(${t.id},'later')">+7 days</button></div>`).join('')}
 <div class="right"><button class="btn" onclick="close_()">Cancel</button></div>`);window._wipThen=then;window._wipO=o}
function wipAct(i,a){const t=tasks.find(x=>x.id===i);if(a==='drop')t.st='done',t.dropped=1;else{const x=new Date(t.due<TODAY?TODAY:t.due);x.setDate(x.getDate()+7);t.due=d(x.toISOString().slice(0,10))}
